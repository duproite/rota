<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rota CP Fix</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota CP Fix">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app — slim header, scrolling view, fixed bottom tab bar (Lançar / Clientes / Envio) */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --line:#d3dae1;
  --fg:#17212b; --muted:#5d6b78;
  --accent:#1d5a86; --accent-ink:#ffffff; --accent-soft:#dbe8f2;
  --compra:#a4500f; --compra-soft:#f8e7d8;
  --pago:#1d7a4a; --pago-soft:#dcf0e3;
  --warn:#9a6a00; --warn-soft:#fbefcf;
  --danger:#b3261e;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --sunk:#0c1116; --line:#2a3642;
  --fg:#e6ecf1; --muted:#93a2b0;
  --accent:#6aaee0; --accent-ink:#0b1a26; --accent-soft:#1b3347;
  --compra:#f0a56a; --compra-soft:#3a2617;
  --pago:#6dd49c; --pago-soft:#163626;
  --warn:#e9c158; --warn-soft:#3a3016;
  --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --sunk:#0c1116; --line:#2a3642;
  --fg:#e6ecf1; --muted:#93a2b0;
  --accent:#6aaee0; --accent-ink:#0b1a26; --accent-soft:#1b3347;
  --compra:#f0a56a; --compra-soft:#3a2617;
  --pago:#6dd49c; --pago-soft:#163626;
  --warn:#e9c158; --warn-soft:#3a3016;
  --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.num{font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{font-weight:600;color:var(--muted);font-size:13px;margin-left:4px}
.net{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.net .dot{width:8px;height:8px;border-radius:50%;background:var(--pago)}
.net.off .dot{background:var(--warn)}
.net.off{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

.testbar{font-size:12.5px;color:var(--muted);background:var(--sunk);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.testbar b{color:var(--fg)}
.testbar.erro{background:var(--warn-soft);color:var(--warn)}
.ln .why{grid-column:2 / -1;font-size:12.5px;color:var(--danger);font-weight:600}

main{padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px;min-height:48px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:64px;resize:vertical}

/* client picker */
.picker{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:10;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.sugg button{display:flex;width:100%;text-align:left;border:0;background:none;padding:11px 14px;gap:10px;align-items:baseline;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.hi{background:var(--accent-soft)}
.sugg .nm{font-weight:600;flex:1;min-width:0}
.sugg .ct{font-size:12.5px;color:var(--muted)}
.sugg .empty{padding:12px 14px;color:var(--muted)}

.chosen{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chosen .who{flex:1;min-width:0}
.chosen .nm{font-weight:700;font-family:var(--display);font-size:17px;line-height:1.2}
.chosen .ct{font-size:13px;color:var(--muted)}
.chosen .sd{text-align:right}
.chosen .sd .v{font-weight:700;font-size:16px}
.chosen .sd .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}

/* operation segmented */
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:11px 6px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.seg button[data-op="compra"][aria-pressed="true"]{color:var(--compra)}
.seg button[data-op="pagamento"][aria-pressed="true"]{color:var(--pago)}

.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money .input{padding-left:44px;font-size:20px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vals{display:grid;gap:12px}
.vals .field.compra .label{color:var(--compra)}
.vals .field.pagamento .label{color:var(--pago)}

.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:16px;min-height:52px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.err{color:var(--danger);font-size:14px;font-weight:500;min-height:0}

/* clients list */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--bg);padding-block:4px 8px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.summary{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.summary b{color:var(--fg);font-size:15px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:active{background:var(--sunk)}
.item .who{flex:1;min-width:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .ct{font-size:12.5px;color:var(--muted)}
.item .v{font-weight:700;white-space:nowrap}
.item .v.zero{color:var(--muted);font-weight:500}
.pendtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* client detail */
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;display:inline-flex;gap:6px;align-items:center;align-self:flex-start;font-size:15px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero .nm{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.hero .ct{color:var(--muted);font-size:13.5px;margin-top:2px}
.hero .big{margin-top:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .big .v{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em}
.hero .big .k{color:var(--muted);font-size:13px;font-weight:600}
.hero .tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hero .tot div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.hero .tot .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.hero .tot .v{font-weight:700}
.hero .tot .c .v{color:var(--compra)} .hero .tot .p .v{color:var(--pago)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.copybox{font-size:13px;color:var(--muted)}

.ext{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.ln:last-child{border-bottom:0}
.ln .tp{grid-row:span 2;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-top:2px}
.ln .tp.c{background:var(--compra-soft);color:var(--compra)}
.ln .tp.p{background:var(--pago-soft);color:var(--pago)}
.ln .d{font-weight:600}
.ln .amt{text-align:right;font-weight:700}
.ln .amt.c{color:var(--compra)} .ln .amt.p{color:var(--pago)}
.ln .meta{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ln .run{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.ln.local{background:var(--warn-soft)}
.ln.venc .meta .due{color:var(--danger);font-weight:600}

/* send view */
.status{border-radius:14px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.status .big{font-family:var(--display);font-weight:800;font-size:28px}
.status p{margin:0;color:var(--muted);font-size:14px}
.pl .rm{border:0;background:none;color:var(--danger);font-size:13px;font-weight:600;padding:2px 0}
.pl .confirm{display:flex;gap:8px;align-items:center;font-size:13px}
.pl .confirm button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.pl .confirm button.yes{background:var(--danger);border-color:var(--danger);color:#fff}
.emptybox{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.sim{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sim input{width:20px;height:20px;accent-color:var(--accent)}

/* preços */
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border-bottom:0}
.prod .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.prod .fo{font-size:12.5px;color:var(--muted)}
.prod .calc{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.prod .calc > div{background:var(--sunk);border-radius:10px;padding:6px 10px;min-width:0}
.prod .calc .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.prod .calc .v{font-weight:700}
.prod .calc .pv .v{color:var(--accent);font-size:16px}
.prod .mg{display:flex;align-items:center;gap:2px}
.prod .mg input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:16px;font-weight:700;text-align:right}
.prod .mg input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prod .mg span{font-weight:700;color:var(--muted)}
.prod .semcusto{grid-column:1 / -1;font-size:13px;color:var(--muted);font-style:italic}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--warn);color:var(--surface);font-size:11px;font-weight:800;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Rota <small>CP Fix</small></div>
  <div class="net" id="net"><span class="dot"></span><span id="netTxt">Online</span></div>
</header>
<div class="testbar" id="sync">Carregando…</div>

<main>
  <!-- PRIMEIRO ACESSO / SEM DADOS -->
  <section class="view" id="v-setup" hidden>
    <h2 id="setupTit">Falta configurar</h2>
    <div class="status"><p id="setupTxt"></p></div>
    <div class="field" id="setupKey">
      <label class="label" for="keyIn">Link de instalação ou chave</label>
      <input class="input" id="keyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole aqui o link que o Du mandou">
      <div class="err" id="keyErr" role="alert"></div>
    </div>
    <button class="btn" id="keySave" type="button">Salvar e entrar</button>
    <button class="btn" id="setupRetry" type="button">Tentar de novo</button>
  </section>

  <!-- LANÇAR -->
  <section class="view" id="v-lancar">
    <h2>Novo lançamento</h2>
    <div class="field">
      <label class="label" for="cliQ">Cliente</label>
      <div class="picker" id="pickerWrap">
        <input class="input" id="cliQ" autocomplete="off" placeholder="Digite o nome ou a cidade">
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div class="chosen" id="chosen" hidden>
        <div class="who"><div class="nm" id="chNm"></div><div class="ct" id="chCt"></div></div>
        <div class="sd"><div class="k">Deve hoje</div><div class="v num" id="chSd"></div></div>
      </div>
      <div style="display:flex;gap:16px" id="chosenLinks" hidden>
        <button class="linkbtn" id="chChange" type="button">Trocar cliente</button>
        <button class="linkbtn" id="chSee" type="button">Ver extrato</button>
      </div>
    </div>

    <div class="field">
      <span class="label">O que aconteceu</span>
      <div class="seg" role="group" aria-label="Operação">
        <button type="button" data-op="compra" aria-pressed="true">Comprou</button>
        <button type="button" data-op="pagamento" aria-pressed="false">Pagou</button>
      </div>
    </div>

    <div class="vals">
      <div class="field compra" id="fCompra">
        <label class="label" for="vCompra">Valor da compra</label>
        <div class="money"><span>R$</span><input class="input num" id="vCompra" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      </div>
      <div class="field pagamento" id="fPag" hidden>
        <label class="label" for="vPag">Valor pago</label>
        <div class="money"><span>R$</span><input class="input num" id="vPag" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      </div>
    </div>

    <div class="field">
      <label class="label" for="dOp">Data</label>
      <input class="input" type="date" id="dOp">
    </div>
    <div class="field">
      <label class="label" for="obs">Observação (opcional)</label>
      <textarea class="input" id="obs" placeholder="Ex.: pagou em cheque pré-datado para 10/12"></textarea>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="save" type="button">Salvar lançamento</button>
  </section>

  <!-- CLIENTES -->
  <section class="view" id="v-clientes" hidden>
    <div id="cliList">
      <div class="search">
        <input class="input" id="cliSearch" placeholder="Buscar cliente ou cidade" autocomplete="off">
        <div class="chips" id="rotaChips"></div>
      </div>
      <div class="view">
        <div class="summary"><span id="sumTxt"></span><b class="num" id="sumVal"></b></div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <div id="cliDetail" class="view" hidden></div>
  </section>

  <!-- PREÇOS -->
  <section class="view" id="v-precos" hidden>
    <div class="search">
      <input class="input" id="prodSearch" placeholder="Buscar produto (ex.: broca sds 8)" autocomplete="off">
    </div>
    <div class="summary"><span id="prodSum"></span><span>Preço = custo + margem</span></div>
    <div class="list" id="prodList"></div>
  </section>

  <!-- ENVIO -->
  <section class="view" id="v-envio" hidden>
    <h2>Envio para a planilha</h2>
    <div class="status" id="sendStatus"></div>
    <button class="btn" id="sendBtn" type="button">Enviar agora</button>
    <div id="pendList" class="view"></div>
  </section>
</main>

<nav class="tabs" aria-label="Seções">
  <button data-tab="lancar" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Lançar</button>
  <button data-tab="clientes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Clientes</button>
  <button data-tab="precos"><svg viewBox="0 0 24 24"><path d="M3 12.5V4a1 1 0 0 1 1-1h8.5L21 11.5 12.5 20z"/><circle cx="8" cy="8" r="1.6"/></svg>Preços</button>
  <button data-tab="envio"><svg viewBox="0 0 24 24"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/></svg>Envio<span class="badge" id="badge" hidden></span></button>
</nav>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
